<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Basel Bus/Tram Tracker (prototype)</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <style>
    html, body, #map { height: 100%; margin: 0; }
    #banner {
      position: absolute; z-index: 1000; top: 10px; left: 50%; transform: translateX(-50%);
      background: rgba(20, 20, 20, 0.85); color: #fff; padding: 6px 14px; border-radius: 6px;
      font: 13px/1.4 -apple-system, sans-serif;
    }
  </style>
</head>
<body>
  <div id="banner">Estimated positions from schedule + live delays (not raw GPS) — Basel BVB/BLT</div>
  <div id="map"></div>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="app.js"></script>
</body>
</html>
